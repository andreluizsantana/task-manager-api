# PostgreSQL rewrites multiple INSERTs into a multi-value command
# SEQUENCE strategy (PostgreSQL) + batch processing // GenerationType.SEQUENCE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasks?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
logging.level.org.hibernate=WARN
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Maximum allowed size for the 'size' page parameter
spring.data.web.pageable.max-page-size=100
# Default page size when the parameter is not sent
spring.data.web.pageable.default-page-size=100
# Better usage of batch_size (organize commands before submitting)
spring.jpa.properties.hibernate.order_inserts=true
# Holds commands and sends them in a batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
# SQL formatting
spring.jpa.properties.hibernate.format_sql=true
# For local development only. Set JWT_SECRET in your environment (e.g. docker/CI) to a random value.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:86400}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
